<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>가족 복습</title>
<meta name="theme-color" content="#2f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1f2a24;--muted:#66706a;--line:#e2ded3;--accent:#2f6b4f;--good:#2f6b4f;--mid:#b7791f;--bad:#b23a3a}
@media (prefers-color-scheme:dark){:root{--bg:#141815;--card:#1e2420;--ink:#e9ece8;--muted:#9aa49e;--line:#2d3530;--accent:#7cc4a0;--good:#7cc4a0;--mid:#e0b25c;--bad:#e07a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:env(safe-area-inset-top) 16px 24px}
main{max-width:520px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0 8px}
h1{font-size:20px;margin:0}
.stats{display:flex;gap:14px;color:var(--muted);font-size:15px}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 20px;margin-top:12px;min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.count{color:var(--muted);font-size:14px}
.prompt{font-size:24px;font-weight:600}
.say{color:var(--muted)}
.answer{font-size:20px;border-top:1px solid var(--line);padding-top:14px}
.answer small{display:block;color:var(--muted);font-size:14px;margin-bottom:4px}
button{font:inherit;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:14px;min-height:52px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.row{display:grid;gap:10px;margin-top:14px}
.grades{grid-template-columns:repeat(3,1fr)}
.grades button{font-size:16px}
.knew{border-color:var(--good)}.hint{border-color:var(--mid)}.forgot{border-color:var(--bad)}
.note{color:var(--muted);font-size:14px;margin-top:16px;text-align:center}
.child .prompt{font-size:30px}.child button{min-height:64px;font-size:19px}
.again{color:var(--mid);font-size:14px;font-weight:600}
.shield{color:var(--muted)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.match button{min-height:72px;font-size:17px;line-height:1.3}
.match button.sel{border-color:var(--accent);border-width:3px}
.match button.ok{visibility:hidden}
.match button.no{border-color:var(--bad)}
</style>
</head>
<body>
<main id="app">
<header><h1 id="who">가족 복습</h1><div class="stats"><span>별 <b id="stars">0</b></span><span>연속 <b id="streak">0</b>일</span><span class="shield" id="shieldBox" hidden>보호권 <b id="shields">0</b></span></div></header>
<section id="view"></section>
<p class="note" id="sync"></p>
</main>
<script>
const $=id=>document.getElementById(id);
const NAMES={Jay:'Jay','wife':'엄마',Yuna:'유나'},LANGS={en:'영어',id:'인도네시아어',zh:'중국어'};
const STARS={knew:3,hint:2,forgot:1};
const MAX_AGAIN=2;      // extra rounds for cards that were not "knew"; then stop, the next lesson takes over
const SHIELD_EVERY=7,SHIELD_MAX=2; // one streak shield per 7 days in a row
// localStorage can throw in private mode; the app still runs, it just forgets on close.
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const day=(ms=Date.now())=>new Date(ms).toLocaleDateString('sv');
const today=()=>day();

// Setup link: index.html#api=<apps script url>&k=<family key>&u=<code>. Saved, then removed from the address bar.
const h=new URLSearchParams(location.hash.slice(1));
if(h.get('api')&&h.get('k')&&h.get('u')){store.set('cfg',{api:h.get('api'),k:h.get('k'),u:h.get('u')});history.replaceState(null,'',location.pathname)}
const cfg=store.get('cfg',null);
// deck items: {c:card, round:0 first look | 1.. again}. Only the first look is sent to the PC (FSRS wants one answer a day).
let deck=[],pos=0,allCards=[];

function stats(){
  const s=store.get('stats',{stars:0,streak:0,last:'',shields:0});s.shields=s.shields||0;
  $('stars').textContent=s.stars;$('streak').textContent=s.streak;$('shields').textContent=s.shields;$('shieldBox').hidden=!s.shields;return s}
function render(html){$('view').innerHTML=html}

// Streak: counts days with at least one answer. Missing exactly one day spends a shield instead of resetting.
function bumpStreak(s,now=Date.now()){
  const t=day(now);if(s.last===t)return s;
  const y=day(now-864e5),y2=day(now-2*864e5);
  if(s.last===y)s.streak+=1;
  else if(s.last===y2&&s.shields>0){s.shields-=1;s.streak+=1;s.usedShield=t}
  else s.streak=1;
  if(s.streak%SHIELD_EVERY===0&&s.shields<SHIELD_MAX)s.shields+=1;
  s.last=t;return s;
}

async function load(){
  if(!cfg){render('<div class="card"><p class="prompt">설정 링크로 열어 주세요</p><p class="say">PC가 보낸 링크를 한 번 열면 다음부터는 바로 시작해요.</p></div>');return}
  const [l,g]=cfg.u.split('-');$('who').textContent=(NAMES[l]||l)+' · '+(LANGS[g]||g);
  if(l==='Yuna')document.body.classList.add('child');
  stats();flush();
  let data=store.get('cards:'+cfg.u,null);
  try{const r=await fetch(cfg.api+'?code='+encodeURIComponent(cfg.u)+'&k='+encodeURIComponent(cfg.k));const j=await r.json();if(j.cards){data=j;store.set('cards:'+cfg.u,j)}}
  catch{} // offline: use the last cards this phone saw
  allCards=data?.cards||[];
  const doneToday=new Set(store.get('done:'+today(),[]));
  deck=allCards.filter(c=>!doneToday.has(c.target)).map(c=>({c,round:0}));pos=0;
  deck.length?card():finished(allCards.length);
}

function card(){
  const {c,round}=deck[pos];
  render(`<div class="card"><div class="count">${pos+1} / ${deck.length}${round?' <span class="again">다시 한 번</span>':''}</div><div class="prompt"></div><div class="say">소리 내서 말해 봐요</div></div>
  <div class="row"><button class="primary" id="show">답 보기</button></div>`);
  document.querySelector('.prompt').textContent=c.prompt;
  $('show').onclick=reveal;
}
function reveal(){
  const {c}=deck[pos],box=document.querySelector('.card'),a=document.createElement('div');a.className='answer';
  const label=document.createElement('small');label.textContent=c.example?'지난번에 맞힌 말':c.question?'선생님 질문':'';
  a.append(label,document.createTextNode(c.example||c.question||'다음 수업에서 선생님과 다시 해 봐요'));box.append(a);
  document.querySelector('.row').outerHTML=`<div class="row grades"><button class="knew" data-g="knew">알았어</button><button class="hint" data-g="hint">헷갈려</button><button class="forgot" data-g="forgot">몰랐어</button></div>`;
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>grade(b.dataset.g));
}
function grade(g){
  const {c,round}=deck[pos];
  if(round===0){
    const q=store.get('queue',[]);
    q.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),target:c.target,grade:g,at:new Date().toISOString()});store.set('queue',q);
    const d=store.get('done:'+today(),[]);d.push(c.target);store.set('done:'+today(),d);
    const s=bumpStreak(stats());s.stars+=STARS[g];store.set('stats',s);stats();flush();
  }else if(g==='knew'){const s=stats();s.stars+=1;store.set('stats',s);stats()}
  // Not sure yet: see it again at the end of this sitting, like a teacher circling back.
  if(g!=='knew'&&round<MAX_AGAIN)deck.push({c,round:round+1});
  ++pos<deck.length?card():finished(1);
}
function finished(had){
  const s=stats(),shieldMsg=s.usedShield===today()?'<p class="say">어제 하루 쉬었지만 보호권으로 연속 기록을 지켰어요.</p>':'';
  const pairs=allCards.filter(c=>c.example);
  render(`<div class="card"><p class="prompt">${had?'오늘 복습 끝!':'오늘은 복습할 카드가 없어요'}</p><p class="say">${had?'결과는 선생님께 보내져서 다음 수업에 쓰여요.':'다음 수업을 하면 새 카드가 생겨요.'}</p>${shieldMsg}</div>
  ${pairs.length>=3?'<div class="row"><button class="primary" id="play">짝 맞추기 놀이</button></div>':''}`);
  if(pairs.length>=3)$('play').onclick=()=>matchGame(pairs);
}

// Matching game: pair each Korean prompt with the words the learner said. Practice only, nothing is sent.
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function matchGame(pairs){
  const pick=shuffle(pairs).slice(0,4);
  const tiles=shuffle(pick.flatMap((c,i)=>[{i,text:c.prompt},{i,text:c.example}]));
  render(`<div class="count" style="margin-top:12px">같은 뜻끼리 두 개를 눌러요</div><div class="match"></div>`);
  const box=document.querySelector('.match');let sel=null,left=pick.length,miss=0;
  tiles.forEach(t=>{const b=document.createElement('button');b.textContent=t.text;b.onclick=()=>{
    if(b.classList.contains('ok')||b===sel)return;
    box.querySelectorAll('.no').forEach(x=>x.classList.remove('no'));
    if(!sel){sel=b;b.classList.add('sel');return}
    const a=sel;sel=null;a.classList.remove('sel');
    if(tiles[[...box.children].indexOf(a)].i===t.i){a.classList.add('ok');b.classList.add('ok');
      if(--left===0){const s=stats();const bonus=miss?1:2;s.stars+=bonus;store.set('stats',s);stats();
        render(`<div class="card"><p class="prompt">다 맞췄어요!</p><p class="say">별 ${bonus}개 더 받았어요.</p></div><div class="row"><button id="again">한 번 더</button></div>`);$('again').onclick=()=>matchGame(pairs)}}
    else{miss++;a.classList.add('no');b.classList.add('no')}
  };box.append(b)});
}

// Results wait on the phone until the upload succeeds; the PC ignores ids it already has.
async function flush(){
  const q=store.get('queue',[]);
  if(!q.length||!cfg){$('sync').textContent='';return}
  $('sync').textContent='보낼 결과 '+q.length+'개';
  try{
    const r=await fetch(cfg.api,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({k:cfg.k,code:cfg.u,results:q})});
    const j=await r.json();
    if(j.ok){const sent=new Set(q.map(x=>x.id));store.set('queue',store.get('queue',[]).filter(x=>!sent.has(x.id)));$('sync').textContent='결과를 보냈어요'}
  }catch{$('sync').textContent='인터넷이 되면 결과를 보낼게요 ('+q.length+'개)'}
}
addEventListener('online',flush);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script>
</body>
</html>
