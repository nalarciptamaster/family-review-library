<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>유나 인니어 스펠링 듣고 쓰기 · 12월 3일 목요일</title><style>
:root{--paper:#f6f4ee;--sheet:#fff;--ink:#1d2a26;--muted:#5d6b66;--line:#dcd8cc;--person:#7b4fc4;--soft:#efe8fb;--done:#2e7d4f;--grid:#d8473d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:19px/1.55 "Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
main{max-width:920px;margin:auto;padding:16px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
nav{display:flex;gap:10px;flex-wrap:wrap}nav a{display:inline-flex;align-items:center;min-height:52px;padding:8px 16px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);text-decoration:none;font-size:17px}
header{display:flex;align-items:center;gap:14px;margin:18px 0 8px}header img{width:76px;height:76px;object-fit:contain;flex:none}h1{font-size:28px;margin:0;line-height:1.25}.sub{margin:2px 0 0;color:var(--muted);font-size:17px}
.how{margin:8px 0 14px;font-size:17px;color:var(--muted)}.progress{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:10px 14px;margin:0 0 16px;border-radius:14px;background:var(--soft);color:var(--person);font-weight:700}
.bar{flex:1;height:10px;border-radius:99px;background:#fff;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--person);transition:width .3s}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.card{position:relative;background:var(--sheet);border:2px solid var(--line);border-radius:18px;padding:14px 16px 16px;min-width:0;overflow-wrap:anywhere}.card.done{border-color:var(--done)}
.num{position:absolute;top:12px;right:14px;font-size:14px;color:var(--muted)}.chip{display:inline-block;font-size:13px;padding:1px 9px;border-radius:99px;background:var(--soft);color:var(--person);margin-left:6px;vertical-align:middle}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-right:40px}.char{font-size:44px;line-height:1.1;font-family:"Noto Serif KR","Batang",serif}.reading{font-size:22px;font-weight:700}.word{font-size:16px;color:var(--muted);flex-basis:100%}
.trace{width:280px;height:280px;max-width:100%;margin:12px auto;touch-action:none;border:2px solid var(--grid);background:#fff linear-gradient(90deg,transparent calc(50% - 1px),#efd2cd calc(50% - 1px),#efd2cd calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(transparent calc(50% - 1px),#efd2cd calc(50% - 1px),#efd2cd calc(50% + 1px),transparent calc(50% + 1px))}
.actions{display:flex;gap:10px;flex-wrap:wrap}button,input{font:inherit}button{min-height:52px;padding:8px 18px;border:2px solid var(--person);border-radius:14px;background:#fff;color:var(--person);font-weight:700;cursor:pointer}button.primary{background:var(--person);color:#fff}button:disabled{opacity:.5}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--person);outline-offset:2px}
.status{min-height:1.6em;margin:10px 0 0;font-size:17px;color:var(--muted)}.done .status{color:var(--done);font-weight:700}
.answer label{display:grid;gap:6px;margin:10px 0;font-size:17px}.answer input{min-height:56px;padding:8px 14px;border:2px solid var(--line);border-radius:14px;font-size:22px;width:100%;min-width:0}
.answer details{margin-top:10px;font-size:17px}.answer summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--muted)}.meaning{font-size:18px;margin:6px 0 0}
.voice-note{font-size:16px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){.bar i{transition:none}}

ss="card answer" data-index="3"><span class="num">4번</span><div class="actions"><button type="button" class="listen primary" data-index="3" hidden>소리 듣기</button></div><p class="meaning">뜻: 정보</p><label>들은 낱말<input autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="4번 답"></label><button type="submit" class="primary">확인</button><details><summary>정답 보기</summary>informasi</details><p class="status" aria-live="polite"></p></form><form class="card answer" data-index="4"><span class="num">5번</span><div class="actions"><button type="button" class="listen primary" data-index="4" hidden>소리 듣기</button></div><p class="meaning">뜻: 묘사</p><label>들은 낱말<input autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="5번 답"></label><button type="submit" class="primary">확인</button><details><summary>정답 보기</summary>deskripsi</details><p class="status" aria-live="polite"></p></form></div></main><script id="plan" type="application/json">{"subject": "spell-id", "date": "2026-12-03", "mode": "지난 목록 복습", "week": 8, "term": 2, "test_date": "2026-12-02", "words": [{"word": "data", "meaning_ko": "자료"}, {"word": "paragraf", "meaning_ko": "문단"}, {"word": "tabel", "meaning_ko": "표"}, {"word": "informasi", "meaning_ko": "정보"}, {"word": "deskripsi", "meaning_ko": "묘사"}], "full_check": false}</script><script id="stroke-data" type="application/json">{}</script><script>
const plan=JSON.parse(document.getElementById('plan').textContent);
const DATA=JSON.parse(document.getElementById('stroke-data').textContent);
const total=document.querySelectorAll('.card').length,done=new Set(),label=document.getElementById('progress-text'),fill=document.querySelector('.bar i');
function mark(card,ok){if(ok)done.add(card);else done.delete(card);card.classList.toggle('done',ok);label.textContent=done.size+' / '+total+' '+(plan.subject.startsWith('spell-')?'맞힘':'다 씀');fill.style.width=(total?done.size/total*100:0)+'%'}
mark(document.createElement('i'),false);
document.querySelectorAll('.trace').forEach(el=>{
 const card=el.closest('.card'),status=card.querySelector('.status');
 if(!window.HanziWriter){status.textContent='쓰기 도구를 불러오지 못했어요. 인터넷에 연결한 뒤 새로 고침해 주세요.';return}
 const writer=HanziWriter.create(el,el.dataset.char,{width:280,height:280,padding:16,showCharacter:false,showOutline:true,showHintAfterMisses:3,highlightOnComplete:true,drawingWidth:24,strokeColor:'#1d2a26',drawingColor:'#7b4fc4',highlightColor:'#2e7d4f',outlineColor:'#e4e0d6',charDataLoader:(ch,ok)=>ok(DATA[ch])});
 const quiz=()=>{mark(card,false);status.textContent='';writer.hideCharacter();writer.quiz({onMistake:()=>status.textContent='그 획 말고 다른 획이에요. 다시 써 봐요.',onCorrectStroke:s=>status.textContent=s.strokesRemaining?'좋아요. '+s.strokesRemaining+'획 남았어요.':'',onComplete:s=>{status.textContent=s.totalMistakes?'다 썼어요. 틀린 획 '+s.totalMistakes+'번':'한 번도 안 틀리고 다 썼어요!';mark(card,true)}})};
 card.querySelector('.again').onclick=()=>{writer.cancelQuiz();quiz()};
 const show=card.querySelector('.animate');
 show.onclick=()=>{show.disabled=true;writer.cancelQuiz();status.textContent='획순을 보여 줄게요.';writer.animateCharacter({onComplete:()=>{show.disabled=false;quiz()}})};
 quiz();
});
const words=document.querySelectorAll('.listen').length,lang=plan.subject==='zh'?'zh-CN':plan.subject==='spell-en'?'en-US':'id-ID';
let voice=null;
function voices(){if(!words)return;voice=('speechSynthesis' in window)?speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').toLowerCase()===lang.toLowerCase())||speechSynthesis.getVoices().find(v=>v.lang.split(/[-_]/)[0]===lang.split('-')[0]):null;document.querySelectorAll('.listen').forEach(b=>b.hidden=!voice);document.querySelectorAll('.voice-note').forEach(n=>n.hidden=!!voice)}
if(words&&'speechSynthesis' in window)speechSynthesis.addEventListener('voiceschanged',voices);voices();
document.querySelectorAll('.listen').forEach(b=>b.onclick=()=>{if(!voice)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plan.words[Number(b.dataset.index)].word);u.lang=lang;u.voice=voice;u.rate=.8;speechSynthesis.speak(u)});
document.querySelectorAll('.answer').forEach(form=>form.onsubmit=e=>{e.preventDefault();const i=Number(form.dataset.index),word=plan.words[i].word,input=form.querySelector('input');const ok=input.value.trim().normalize('NFC').toLocaleLowerCase()===word.normalize('NFC').toLocaleLowerCase();form.querySelector('.status').textContent=ok?'맞았어요!':input.value.trim()?'조금 달라요. 다시 듣고 써 봐요.':'먼저 들은 낱말을 써 봐요.';mark(form,ok)});
document.querySelectorAll('.zh-word').forEach(card=>card.querySelector('.said').onclick=()=>{mark(card,true);card.querySelector('.status').textContent='소리 내어 읽었어요.'});
