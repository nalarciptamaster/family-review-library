 const quiz=()=>{writer.hideCharacter();writer.quiz({onMistake:()=>status.textContent='그 획을 다시 써 봐요.',onCorrectStroke:s=>status.textContent='남은 획 '+s.strokesRemaining+'개',onComplete:()=>status.textContent='다 썼어요!'});status.textContent='한 획씩 따라 써 보세요.'};
 el.parentElement.querySelector('.again').onclick=()=>{writer.cancelQuiz();quiz()};
 const animate=el.parentElement.querySelector('.animate');
 animate.onclick=()=>{animate.disabled=true;writer.cancelQuiz();writer.animateCharacter({onComplete:()=>{animate.disabled=false;quiz()}})};
 quiz();
});
const lang=plan.subject==='zh'?'zh-CN':plan.subject==='spell-en'?'en-US':'id-ID';
let voice=null;
function voices(){voice=('speechSynthesis' in window)?speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').toLowerCase()===lang.toLowerCase())||speechSynthesis.getVoices().find(v=>v.lang.split(/[-_]/)[0]===lang.split('-')[0]):null;document.querySelectorAll('.listen').forEach(b=>b.hidden=!voice);document.querySelectorAll('.voice-note').forEach(n=>n.hidden=!!voice)}
if('speechSynthesis' in window)speechSynthesis.addEventListener('voiceschanged',voices);voices();
document.querySelectorAll('.listen').forEach(b=>b.onclick=()=>{if(!voice)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plan.words[Number(b.dataset.index)].word);u.lang=lang;u.voice=voice;u.rate=.85;speechSynthesis.speak(u)});
const correct=new Set();
document.querySelectorAll('.answer').forEach(form=>form.onsubmit=e=>{e.preventDefault();const i=Number(form.dataset.index),word=plan.words[i].word,input=form.querySelector('input');const ok=input.value.trim().normalize('NFC').toLocaleLowerCase()===word.normalize('NFC').toLocaleLowerCase();if(ok)correct.add(i);else correct.delete(i);form.querySelector('.status').textContent=ok?'맞았어요!':'다시 들어 보고 써 보세요.';document.getElementById('score').textContent=correct.size+' / '+plan.words.length+'개 맞았어요';});
</script></body></html>
